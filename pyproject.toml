[project]
name = "taui"
version = "0.9"
description = "Agentic coding interface you can reshape"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Santosh", email = "santosh.rajan.work@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
keywords = ["ai", "agent", "coding", "tui", "llm", "textual"]
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "rich>=13.0",
    "textual>=3.0",
    "textual-diff-view>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/nottherealsanta/taui"
Repository = "https://github.com/nottherealsanta/taui"
Issues = "https://github.com/nottherealsanta/taui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
taui = "taui.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = ["-ra"]
asyncio_mode = "auto"
# Backstop: no test should take this long. Turns an accidental hang (e.g. a
# real network/auth call or a never-settling Textual timer) into a fast,
# diagnostic failure instead of blocking the whole suite.
timeout = 120
markers = [
    "agent: agent loop, context, prompt, retry, tokenizer, and sub-agent tests",
    "commands: slash command registry and builtin command tests",
    "common: shared utility helpers used by multiple domains",
    "config: configuration, model catalog, and CLI plumbing tests",
    "cost: cost and usage accounting tests",
    "extensions: extension discovery, loading, hooks, and extension surfaces",
    "git: git tool and git-backed behavior tests",
    "lsp: LSP and symbol-index tests",
    "mcp: MCP client, server, and banner tests",
    "memory: memory tool tests",
    "permissions: permission DSL and policy tests",
    "prompts: prompt builder and prompt snapshot tests",
    "provider: provider abstraction, model, scenario, and provider error tests",
    "self_edit: self-edit store, inventory, modal, and scoped tooling tests",
    "session: session composition, resume, isolation, and picker tests",
    "skills: skill registry and skill banner tests",
    "store: SQLite store, replay, tailing, and persistence tests",
    "tasks: background task and background bash tests",
    "tools: tool registry, builtin tools, permissions, and tool UI grouping tests",
    "tui: Textual app, widget, keyboard, modal, and sidebar tests",
    "webfetch: web fetch tool tests",
    "worktree: git worktree support tests",
]
testpaths = ["tests"]

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
only-include = [
    "AGENTS.md",
    "LICENSE",
    "README.md",
    "docs",
    "pyproject.toml",
    "taui",
    "tests",
    "uv.lock",
]
exclude = [
    "/taui/**/.taui",
]

[tool.hatch.build.targets.wheel]
packages = ["taui"]
exclude = [
    "/taui/**/.taui",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-textual-snapshot>=1.1.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.10",
    "textual-dev>=1.8.0",
]
