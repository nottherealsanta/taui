[project]
name = "taui"
version = "0.1.0"
description = "Agentic coding interface you can reshape"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.34", "websockets>=14.0"]
tui = ["textual>=3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
taui = "taui.cli:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
