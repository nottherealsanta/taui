[project]
name = "taui"
version = "0.1.0"
description = "Agentic coding interface you can reshape"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
taui = "taui.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
