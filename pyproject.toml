[project]
name = "taui"
version = "0.8.1"
description = "Agentic coding interface you can reshape"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Santosh", email = "santosh.rajan.work@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
keywords = ["ai", "agent", "coding", "tui", "llm", "textual"]
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.28",
    "rich>=13.0",
    "textual>=3.0",
    "textual-diff-view>=0.1.2",
]

[project.urls]
Homepage = "https://github.com/nottherealsanta/taui"
Repository = "https://github.com/nottherealsanta/taui"
Issues = "https://github.com/nottherealsanta/taui/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
taui = "taui.main:main"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.sdist]
only-include = [
    "AGENTS.md",
    "LICENSE",
    "README.md",
    "docs",
    "pyproject.toml",
    "taui",
    "tests",
    "uv.lock",
]
exclude = [
    "/taui/**/.taui",
]

[tool.hatch.build.targets.wheel]
packages = ["taui"]
exclude = [
    "/taui/**/.taui",
]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.3.0",
    "pytest-textual-snapshot>=1.1.0",
    "textual-dev>=1.8.0",
]
