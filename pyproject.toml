[project]
name = "taui"
version = "0.1.1"
description = "An agentic coding interface"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Santosh" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "textual>=8.0.0",
]

[project.scripts]
taui = "taui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taui"]

[dependency-groups]
dev = [
    "textual-dev>=1.8.0",
]
