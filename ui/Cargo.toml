[package]
name = "taui_ui"
version = "0.1.0"
edition = "2021"
description = "Taui desktop UI"
license = "MIT"

[dependencies]
anyhow = "1.0"
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pulldown-cmark = "0.9"

[dev-dependencies]
pretty_assertions = "1.4"
