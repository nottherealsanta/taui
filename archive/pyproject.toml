[project]
name = "taui"
version = "0.1.1"
description = "An agentic coding interface"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    { name = "Santosh" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
]
dependencies = [
    "aiosqlite>=0.20.0",
    "fastapi>=0.116.0",
    "httpx>=0.27.0",
    "platformdirs>=4.3.0",
    "pydantic>=2.11.0",
    "rich>=13.7.0",
    "tree-sitter>=0.25.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
    "tree-sitter-typescript>=0.23.2",
    "uvicorn>=0.35.0",
]

[project.scripts]
taui = "taui.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taui"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "websockets>=15.0.0",
]
